  <g>
    <path d="M644 384v56h330" stroke="#ef4444" stroke-opacity="0.6" fill="none" stroke-dasharray="4 5"/>
    <path d="M974 432v-46" stroke="#ef4444" stroke-opacity="0.6" fill="none" stroke-dasharray="4 5"/>
