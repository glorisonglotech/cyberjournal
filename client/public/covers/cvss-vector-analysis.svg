<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="CVSS severity gauge and vector string">
  <rect width="1200" height="675" fill="#08080a"/>
  <g stroke="#1b1b20"><path d="M0 92h1200M0 588h1200M620 0v675"/></g>

  <text x="56" y="56" font-family="ui-monospace, monospace" font-size="13" letter-spacing="3.4" fill="#5a5a63">GLORISON CYBER JOURNAL</text>
  <text x="1144" y="56" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2.4" fill="#8a4a4c">VULNERABILITY DESK</text>

  <g fill="none" stroke-width="10">
    <path d="M140 440a230 230 0 0 1 460 0" stroke="#1d1d22"/>
    <path d="M140 440a230 230 0 0 1 260 -212" stroke="#4ade80" stroke-opacity="0.35"/>
    <path d="M400 228a230 230 0 0 1 110 -8" stroke="#edb200" stroke-opacity="0.4"/>
    <path d="M510 220a230 230 0 0 1 90 220" stroke="#ef4444" stroke-opacity="0.75"/>
  </g>

  <g font-family="ui-monospace, monospace">
    <text x="370" y="360" text-anchor="middle" font-size="86" fill="#eae6e0" letter-spacing="-3">9.8</text>
    <text x="370" y="392" text-anchor="middle" font-size="11" letter-spacing="3" fill="#ff6568">CRITICAL</text>
    <text x="370" y="466" text-anchor="middle" font-size="10" letter-spacing="2" fill="#4e4e57">BASE SCORE</text>
    <text x="370" y="486" text-anchor="middle" font-size="10" letter-spacing="2" fill="#3f3f47">NOT PRIORITY</text>
  </g>

  <g font-family="ui-monospace, monospace">
    <text x="660" y="156" font-size="10.5" letter-spacing="2.4" fill="#6a6a73">VECTOR</text>
    <rect x="660" y="172" width="484" height="74" fill="#0b0b0e" stroke="#2b2b32"/>
    <text x="678" y="200" font-size="11.5" fill="#8b8b93">CVSS:3.1/AV:N/AC:L/PR:N/UI:N/</text>
    <text x="678" y="222" font-size="11.5" fill="#8b8b93">S:U/C:H/I:H/A:H</text>

    <text x="660" y="292" font-size="10.5" letter-spacing="2.4" fill="#6a6a73">METRIC DECISIONS</text>
    <path d="M660 306h484" stroke="#232329"/>

    <g font-size="11">
      <text x="660" y="332" fill="#4f4f58">AV</text><text x="700" y="332" fill="#8b8b93">N — network reachable</text>
      <text x="660" y="356" fill="#4f4f58">AC</text><text x="700" y="356" fill="#8b8b93">L — no special conditions</text>
      <text x="660" y="380" fill="#4f4f58">PR</text><text x="700" y="380" fill="#8b8b93">N — unauthenticated</text>
      <text x="660" y="404" fill="#4f4f58">UI</text><text x="700" y="404" fill="#8b8b93">N — no user action</text>
      <text x="660" y="428" fill="#4f4f58">C/I/A</text><text x="700" y="428" fill="#8b8b93">H/H/H — total impact</text>
    </g>

    <text x="660" y="480" font-size="10.5" letter-spacing="2.4" fill="#6a6a73">ENVIRONMENTAL</text>
    <path d="M660 494h484" stroke="#232329"/>
    <text x="660" y="520" font-size="11" fill="#8b8b93">E:P · RL:O · CR:H · IR:H · AR:M</text>
    <text x="660" y="546" font-size="11" fill="#5f5f68">internet-facing + regulated data → stays critical</text>
    <text x="660" y="568" font-size="11" fill="#3f3f47">internal + SSO + no exploit in the wild → reconsider</text>
  </g>

  <text x="56" y="618" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2.2" fill="#4a4a52">FIG. 09 — READ THE VECTOR, NOT THE NUMBER</text>
  <text x="1144" y="618" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2.2" fill="#4a4a52">SAMPLE ANALYSIS</text>
</svg>
