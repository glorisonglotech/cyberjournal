<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="API request flow showing an ownership check">
  <rect width="1200" height="675" fill="#08080a"/>
  <g stroke="#1b1b20"><path d="M0 92h1200M0 592h1200M600 0v675"/></g>

  <text x="56" y="56" font-family="ui-monospace, monospace" font-size="13" letter-spacing="3.4" fill="#5a5a63">GLORISON CYBER JOURNAL</text>
  <text x="1144" y="56" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2.4" fill="#8a4a4c">API SECURITY</text>

  <g font-family="ui-monospace, monospace">
    <rect x="72" y="150" width="184" height="96" fill="#0b0b0e" stroke="#2b2b32"/>
    <text x="88" y="176" font-size="9.5" letter-spacing="2" fill="#6a6a73">CLIENT A</text>
    <text x="88" y="200" font-size="11.5" fill="#8b8b93">Bearer ██████</text>
    <text x="88" y="222" font-size="10.5" fill="#4e4e57">user_id: 65f1c0…</text>

    <rect x="72" y="322" width="184" height="96" fill="#0b0b0e" stroke="#2b2b32"/>
    <text x="88" y="348" font-size="9.5" letter-spacing="2" fill="#6a6a73">CLIENT B</text>
    <text x="88" y="372" font-size="11.5" fill="#8b8b93">Bearer ██████</text>
    <text x="88" y="394" font-size="10.5" fill="#4e4e57">same endpoint</text>
  </g>

  <g stroke="#2b2b32">
    <path d="M256 198h118"/>
    <path d="M374 192v12M256 390h118M374 384v12"/>
  </g>
  <g fill="#3a3a42"><path d="M374 190l10 8-10 8z"/><path d="M374 382l10 8-10 8z"/></g>

  <g font-family="ui-monospace, monospace">
    <rect x="384" y="128" width="368" height="352" fill="#0b0b0e" stroke="#2b2b32"/>
    <rect x="384" y="128" width="368" height="32" fill="#101014" stroke="#2b2b32"/>
    <text x="400" y="148" font-size="9.5" letter-spacing="2" fill="#6a6a73">GET /API/INVOICES/:ID</text>

    <text x="400" y="196" font-size="11" fill="#ff6568">requireAuth()</text>
    <text x="400" y="216" font-size="10" fill="#4e4e57">signature valid · exp ok</text>

    <path d="M400 236h336" stroke="#1f1f24"/>

    <text x="400" y="262" font-size="11" fill="#ff6568">Invoice.findById(req.params.id)</text>
    <text x="400" y="282" font-size="10" fill="#8a4a4c">no owner predicate → BOLA</text>

    <path d="M400 302h336" stroke="#1f1f24"/>

    <text x="400" y="328" font-size="11" fill="#a9c7a0">Invoice.findOne({ _id, owner })</text>
    <text x="400" y="348" font-size="10" fill="#5f7a62">scoped to req.user.id</text>

    <text x="400" y="392" font-size="10.5" fill="#6a6a73">401 unauthenticated</text>
    <text x="400" y="414" font-size="10.5" fill="#6a6a73">404 not owned</text>
    <text x="400" y="436" font-size="10.5" fill="#6a6a73">429 rate limited</text>
    <text x="400" y="458" font-size="10.5" fill="#6a6a73">413 payload too large</text>
  </g>

  <g>
    <path d="M752 304h96" stroke="#2b2b32"/>
    <path d="M848 296l12 8-12 8z" fill="#3a3a42"/>
    <rect x="864" y="248" width="228" height="112" fill="#0b0b0e" stroke="#232329"/>
    <text x="880" y="274" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="2" fill="#6a6a73">DATA</text>
    <text x="880" y="300" font-family="ui-monospace, monospace" font-size="11" fill="#8b8b93">owner = user.sub</text>
    <text x="880" y="322" font-family="ui-monospace, monospace" font-size="11" fill="#8b8b93">projection: explicit</text>
    <text x="880" y="344" font-family="ui-monospace, monospace" font-size="11" fill="#8b8b93">role from database</text>
  </g>

  <g font-family="ui-monospace, monospace" font-size="11" fill="#5f5f68">
    <text x="72" y="490">$ curl -H "Authorization: Bearer $TOKEN_B" \</text>
    <text x="72" y="512">    /api/invoices/$ID_FROM_A</text>
    <text x="72" y="540" fill="#a9c7a0">HTTP 404  {"ok": false}</text>
  </g>

  <text x="72" y="616" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2.2" fill="#4a4a52">FIG. 07 — AUTHORISATION BELONGS IN THE QUERY</text>
  <text x="1144" y="640" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2.2" fill="#4a4a52">DIFFICULTY / INTERMEDIATE</text>
</svg>
